name: Verify Android application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform android
        env:
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
